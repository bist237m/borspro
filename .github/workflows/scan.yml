name: BIST Tarayıcı

on:
  schedule:
    # Piyasa saatlerinde (10:00-16:30) her 30 dakikada bir — sadece fiyat güncelleme, hızlı
    - cron: '*/30 10-16 * * 1-5'
      timezone: 'Europe/Istanbul'
    # Her iş günü 17:25 TRT — kapanışa yakın fiyat + ana filtre taraması (sync + scan)
    - cron: '25 17 * * 1-5'
      timezone: 'Europe/Istanbul'
    # Piyasa saatlerinde 2 saatte bir (10-16 arası) — Filtre 5/6 (4h/2h/30m/1d/1wk zaman dilimleri)
    - cron: '0 10-16/2 * * 1-5'
      timezone: 'Europe/Istanbul'
    # Salı-Cumartesi 02:00 TRT — bir önceki iş gününün geçmiş verisini çek (piyasa kapalıyken)
    - cron: '0 2 * * 2-6'
      timezone: 'Europe/Istanbul'
    # Her iş günü 08:00 TRT — piyasa açılmadan önce temel+teknik veri (TradingView + İş Yatırım)
    - cron: '0 8 * * 1-5'
      timezone: 'Europe/Istanbul'
    # Her gün 4 saatte bir — KAP haberleri
    - cron: '0 */4 * * *'
      timezone: 'Europe/Istanbul'
    # Her Pazartesi 04:00 TRT — İş Yatırım kriter listesi (nadiren değişir, haftalık yeterli)
    - cron: '0 4 * * 1'
      timezone: 'Europe/Istanbul'
  workflow_dispatch:
    inputs:
      action:
        description: 'Çalıştırılacak işlem'
        required: false
        default: 'full'
        type: choice
        options:
          - full          # sync + scan
          - scan          # sadece ana tarama
          - sync          # sadece fiyat güncelleme
          - history       # 1 yıllık geçmiş veri çek
          - extra_scan    # Filtre 5 ve 6
          - fundamentals  # temel + teknik veri (FAVÖK, RSI, İş Yatırım PE/PB/ROE vb.)
          - news          # KAP haberleri
          - kriterleri    # İş Yatırım screener kriter listesini txt'e kaydet

# Aynı anda birden fazla çalışma DB'ye eşzamanlı yazmasın diye kuyruğa alınır
# (iptal etmez, sadece sıraya sokar — cancel-in-progress: false)
concurrency:
  group: bist-tarayici
  cancel-in-progress: false

jobs:
  tarama:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bağımlılıkları yükle
        working-directory: worker/python
        run: pip install -r requirements.txt

      - name: İşlemi çalıştır
        working-directory: worker/python/src
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              '*/30 10-16 * * 1-5') ACTION="sync" ;;
              '25 17 * * 1-5')      ACTION="full" ;;
              '0 10-16/2 * * 1-5')  ACTION="extra_scan" ;;
              '0 2 * * 2-6')        ACTION="history" ;;
              '0 8 * * 1-5')        ACTION="fundamentals" ;;
              '0 */4 * * *')        ACTION="news" ;;
              '0 4 * * 1')          ACTION="kriterleri" ;;
              *)                    ACTION="full" ;;
            esac
          else
            ACTION="${{ github.event.inputs.action || 'full' }}"
          fi

          echo "Çalıştırılıyor: $ACTION"

          if [ "$ACTION" = "full" ]; then
            python main.py --sync --scan
          elif [ "$ACTION" = "scan" ]; then
            python main.py --scan
          elif [ "$ACTION" = "sync" ]; then
            python main.py --sync
          elif [ "$ACTION" = "history" ]; then
            python main.py --history
          elif [ "$ACTION" = "extra_scan" ]; then
            python main.py --extra-scan
          elif [ "$ACTION" = "fundamentals" ]; then
            python main.py --fundamentals
          elif [ "$ACTION" = "news" ]; then
            python main.py --news
          elif [ "$ACTION" = "kriterleri" ]; then
            python main.py --kriterleri
          fi
