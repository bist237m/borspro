name: BIST Tarayıcı

on:
  schedule:
    # --- SYNC (09:30 - 18:30 arası her 15 dakikada bir fiyat güncelleme) ---
    - cron: '30,45 9 * * 1-5'
      timezone: 'Europe/Istanbul'
    - cron: '*/15 10-17 * * 1-5'
      timezone: 'Europe/Istanbul'
    - cron: '0,15,30 18 * * 1-5'
      timezone: 'Europe/Istanbul'

    # --- SCAN (09:55'te başlar, 10:20'den 18:20'ye kadar her 30 dakikada bir: :20 ve :50) ---
    - cron: '55 9 * * 1-5'
      timezone: 'Europe/Istanbul'
    - cron: '20,50 10-17 * * 1-5'
      timezone: 'Europe/Istanbul'
    - cron: '20 18 * * 1-5'
      timezone: 'Europe/Istanbul'

    # --- DİĞER PERİYODİK GÖREVLER ---
    # Piyasa saatlerinde 2 saatte bir (10-16 arası) — Filtre 5/6
    - cron: '0 10-16/2 * * 1-5'
      timezone: 'Europe/Istanbul'
    # Salı-Cumartesi 02:00 TRT — Geçmiş veri
    - cron: '0 2 * * 2-6'
      timezone: 'Europe/Istanbul'
    # Her iş günü 08:00 TRT — Temel + teknik veri (TradingView + İş Yatırım)
    - cron: '0 8 * * 1-5'
      timezone: 'Europe/Istanbul'
    # Her gün 4 saatte bir — KAP haberleri
    - cron: '0 */4 * * *'
      timezone: 'Europe/Istanbul'
    # Her Pazartesi 04:00 TRT — İş Yatırım kriter listesi
    - cron: '0 4 * * 1'
      timezone: 'Europe/Istanbul'
    # Her ayın 1'i 05:00 TRT — Bilanço verisi
    - cron: '0 5 1 * *'
      timezone: 'Europe/Istanbul'
    # Her ayın 2'si 05:00 TRT — Sektör ve endeks üyeliği
    - cron: '0 5 2 * *'
      timezone: 'Europe/Istanbul'
    # Her Pazar 06:00 TRT — Sermaye artırımı / temettü takvimi
    - cron: '0 6 * * 0'
      timezone: 'Europe/Istanbul'

  workflow_dispatch:
    inputs:
      action:
        description: 'Çalıştırılacak işlem'
        required: false
        default: 'full'
        type: choice
        options:
          - full          # sync + scan
          - scan          # sadece ana tarama
          - sync          # sadece fiyat güncelleme
          - history       # 1 yıllık geçmiş veri çek
          - extra_scan    # Filtre 5 ve 6
          - fundamentals  # temel + teknik veri (FAVÖK, RSI, İş Yatırım PE/PB/ROE vb.)
          - news          # KAP haberleri
          - kriterleri    # İş Yatırım screener kriter listesini txt'e kaydet
          - balance_sheet # bilanço verisi (dönemsel, JSON)
          - sector_index  # sektör ve endeks üyeliği
          - corporate_actions # sermaye artırımı / temettü takvimi

concurrency:
  group: bist-tarayici
  cancel-in-progress: false

jobs:
  tarama:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bağımlılıkları yükle
        working-directory: worker/python
        run: pip install -r requirements.txt

      - name: İşlemi çalıştır
        working-directory: worker/python/src
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              '30,45 9 * * 1-5'|'*/15 10-17 * * 1-5'|'0,15,30 18 * * 1-5') ACTION="sync" ;;
              '55 9 * * 1-5'|'20,50 10-17 * * 1-5'|'20 18 * * 1-5')        ACTION="scan" ;;
              '0 10-16/2 * * 1-5')  ACTION="extra_scan" ;;
              '0 2 * * 2-6')        ACTION="history" ;;
              '0 8 * * 1-5')        ACTION="fundamentals" ;;
              '0 */4 * * *')        ACTION="news" ;;
              '0 4 * * 1')          ACTION="kriterleri" ;;
              '0 5 1 * *')          ACTION="balance_sheet" ;;
              '0 5 2 * *')          ACTION="sector_index" ;;
              '0 6 * * 0')          ACTION="corporate_actions" ;;
              *)                    ACTION="full" ;;
            esac
          else
            ACTION="${{ github.event.inputs.action || 'full' }}"
          fi

          echo "Çalıştırılıyor: $ACTION"

          if [ "$ACTION" = "full" ]; then
            python main.py --sync --scan
          elif [ "$ACTION" = "scan" ]; then
            python main.py --scan
          elif [ "$ACTION" = "sync" ]; then
            python main.py --sync
          elif [ "$ACTION" = "history" ]; then
            python main.py --history
          elif [ "$ACTION" = "extra_scan" ]; then
            python main.py --extra-scan
          elif [ "$ACTION" = "fundamentals" ]; then
            python main.py --fundamentals
          elif [ "$ACTION" = "news" ]; then
            python main.py --news
          elif [ "$ACTION" = "kriterleri" ]; then
            python main.py --kriterleri
          elif [ "$ACTION" = "balance_sheet" ]; then
            python main.py --balance-sheet
          elif [ "$ACTION" = "sector_index" ]; then
            python main.py --sector-index
          elif [ "$ACTION" = "corporate_actions" ]; then
            python main.py --corporate-actions
          fi