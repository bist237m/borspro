name: BIST Tarayıcı

on:
  schedule:
    # TÜM SAATLER UTC — GitHub Actions'ın schedule tetikleyicisi HER ZAMAN
    # UTC'dir. `timezone:` anahtarı GitHub'da yeni eklendi (2026 başı) ama
    # topluluk raporlarına göre bazı hesaplarda tutarsız çalışabiliyor —
    # bu yüzden riske girmeyip saatleri elle UTC'ye çevirdik (TSİ = UTC+3,
    # Türkiye DST uygulamıyor, yıl boyu sabit). Yorumlardaki saat TSİ'dir.

    # --- SYNC (TSİ 09:30 - 18:30 arası her 15 dakikada bir fiyat güncelleme) ---
    - cron: '30,45 6 * * 1-5'      # TSİ 09:30, 09:45
    - cron: '*/15 7-14 * * 1-5'    # TSİ 10:00-17:45
    - cron: '0,15,30 15 * * 1-5'   # TSİ 18:00, 18:15, 18:30

    # --- SCAN (TSİ 09:55'te başlar, 10:20'den 18:20'ye kadar her 30 dakikada bir) ---
    - cron: '55 6 * * 1-5'         # TSİ 09:55
    - cron: '20,50 7-14 * * 1-5'   # TSİ 10:20-17:50
    - cron: '20 15 * * 1-5'        # TSİ 18:20

    # --- DİĞER PERİYODİK GÖREVLER ---
    # NOT: Eskiden burada 2 saatte bir "extra_scan" (Filtre 5/6) vardı. Kaldırıldı:
    # extra_scan.py artık run_full_scan() çağırıyor, yani --scan ile BİREBİR aynı
    # işi yapıyor. Ek filtreler zaten her --scan'e dahil (include_extra=True),
    # dolayısıyla o cron tam taramayı gereksizce ikinci kez çalıştırıyordu.
    # Salı-Cumartesi TSİ 02:00 — Geçmiş veri
    # DİKKAT: TSİ 02:00, bir önceki günün 23:00 UTC'sine denk gelir — bu yüzden
    # gün aralığı da bir gün geriye kayıyor (TSİ Sal-Cmt = UTC Pzt-Cum).
    - cron: '0 23 * * 1-5'         # TSİ Salı-Cumartesi 02:00
    # Her iş günü TSİ 08:00 — Temel + teknik veri (TradingView + İş Yatırım)
    - cron: '0 5 * * 1-5'          # TSİ 08:00
    # Her gün 4 saatte bir — KAP haberleri
    - cron: '0 1,5,9,13,17,21 * * *'  # TSİ 04,08,12,16,20,00
    # Her Pazartesi TSİ 04:00 — İş Yatırım kriter listesi
    - cron: '0 1 * * 1'            # TSİ Pazartesi 04:00
    # Her ayın 1'i TSİ 05:00 — Bilanço verisi
    - cron: '0 2 1 * *'            # TSİ ayın 1'i 05:00
    # Her ayın 2'si TSİ 05:00 — Sektör ve endeks üyeliği
    - cron: '0 2 2 * *'            # TSİ ayın 2'si 05:00
    # Her Pazar TSİ 06:00 — Sermaye artırımı / temettü takvimi
    - cron: '0 3 * * 0'            # TSİ Pazar 06:00

  workflow_dispatch:
    inputs:
      action:
        description: 'Çalıştırılacak işlem'
        required: false
        default: 'full'
        type: choice
        options:
          - full          # sync + scan
          - scan          # sadece ana tarama
          - sync          # sadece fiyat güncelleme
          - history       # 1 yıllık geçmiş veri çek
          - extra_scan    # Filtre 5 ve 6
          - fundamentals  # temel + teknik veri (FAVÖK, RSI, İş Yatırım PE/PB/ROE vb.)
          - news          # KAP haberleri
          - kriterleri    # İş Yatırım screener kriter listesini txt'e kaydet
          - balance_sheet # bilanço verisi (dönemsel, JSON)
          - sector_index  # sektör ve endeks üyeliği
          - corporate_actions # sermaye artırımı / temettü takvimi

concurrency:
  group: bist-tarayici
  cancel-in-progress: false

jobs:
  tarama:
    runs-on: ubuntu-latest
    # Tarama normalde ~10 dk sürüyor. Bir şey ters giderse (API yanıt vermiyor,
    # sonsuz retry) koşu 6 saatlik GitHub tavanına kadar dakika yakmasın.
    timeout-minutes: 25
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bağımlılıkları yükle
        working-directory: worker/python
        run: pip install -r requirements.txt

      - name: İşlemi çalıştır
        working-directory: worker/python/src
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              '30,45 6 * * 1-5'|'*/15 7-14 * * 1-5'|'0,15,30 15 * * 1-5') ACTION="sync" ;;
              '55 6 * * 1-5'|'20,50 7-14 * * 1-5'|'20 15 * * 1-5')        ACTION="scan" ;;
              '0 23 * * 1-5')       ACTION="history" ;;
              '0 5 * * 1-5')        ACTION="fundamentals" ;;
              '0 1,5,9,13,17,21 * * *') ACTION="news" ;;
              '0 1 * * 1')          ACTION="kriterleri" ;;
              '0 2 1 * *')          ACTION="balance_sheet" ;;
              '0 2 2 * *')          ACTION="sector_index" ;;
              '0 3 * * 0')          ACTION="corporate_actions" ;;
              *)                    ACTION="full" ;;
            esac
          else
            ACTION="${{ github.event.inputs.action || 'full' }}"
          fi

          echo "Çalıştırılıyor: $ACTION"

          if [ "$ACTION" = "full" ]; then
            python main.py --sync --scan
          elif [ "$ACTION" = "scan" ]; then
            python main.py --scan
          elif [ "$ACTION" = "sync" ]; then
            python main.py --sync
          elif [ "$ACTION" = "history" ]; then
            python main.py --history
          elif [ "$ACTION" = "extra_scan" ]; then
            python main.py --extra-scan
          elif [ "$ACTION" = "fundamentals" ]; then
            python main.py --fundamentals
          elif [ "$ACTION" = "news" ]; then
            python main.py --news
          elif [ "$ACTION" = "kriterleri" ]; then
            python main.py --kriterleri
          elif [ "$ACTION" = "balance_sheet" ]; then
            python main.py --balance-sheet
          elif [ "$ACTION" = "sector_index" ]; then
            python main.py --sector-index
          elif [ "$ACTION" = "corporate_actions" ]; then
            python main.py --corporate-actions
          fi