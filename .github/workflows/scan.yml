name: BIST Tarayıcı

on:
  schedule:
    # Her iş günü 17:25 TRT — ana filtre taraması (sync + scan)
    - cron: '25 17 * * 1-5'
      timezone: 'Europe/Istanbul'
    # Her Pazar 20:00 TRT — temel veri + KAP haberleri (haftalık, daha seyrek)
    - cron: '0 20 * * 0'
      timezone: 'Europe/Istanbul'
  workflow_dispatch:
    inputs:
      action:
        description: 'Çalıştırılacak işlem'
        required: false
        default: 'full'
        type: choice
        options:
          - full          # sync + scan
          - scan          # sadece ana tarama
          - sync          # sadece fiyat güncelleme
          - history       # 1 yıllık geçmiş veri çek
          - extra_scan    # Filtre 5 ve 6
          - fundamentals  # temel + teknik veri (FAVÖK, RSI vb.)
          - news          # KAP haberleri

jobs:
  tarama:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bağımlılıkları yükle
        working-directory: worker/python
        run: pip install -r requirements.txt

      - name: İşlemi çalıştır
        working-directory: worker/python/src
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "25 17 * * 1-5" ]; then
              ACTION="full"
            else
              ACTION="weekly"
            fi
          else
            ACTION="${{ github.event.inputs.action || 'full' }}"
          fi

          echo "Çalıştırılıyor: $ACTION"

          if [ "$ACTION" = "full" ]; then
            python main.py --sync --scan
          elif [ "$ACTION" = "scan" ]; then
            python main.py --scan
          elif [ "$ACTION" = "sync" ]; then
            python main.py --sync
          elif [ "$ACTION" = "history" ]; then
            python main.py --history
          elif [ "$ACTION" = "extra_scan" ]; then
            python main.py --extra-scan
          elif [ "$ACTION" = "fundamentals" ]; then
            python main.py --fundamentals
          elif [ "$ACTION" = "news" ]; then
            python main.py --news
          elif [ "$ACTION" = "weekly" ]; then
            python main.py --fundamentals --news
          fi